<style>
  :root{
    --bg:#F6F5F2;
    --surface:#FFFFFF;
    --surface-2:#FBFAF7;
    --border:#E5E1D8;
    --border-strong:#D6D1C4;
    --text:#221F1A;
    --text-muted:#5C5648;
    --text-faint:#6E6858;
    --accent:#3454D1;
    --accent-ink:#1E3AA8;
    --accent-soft:#E8ECFB;
    --ring:rgba(52,84,209,.35);
    --danger:#C84B4B;
    --danger-soft:#FBEAEA;
    --s-gray:#8B8676;
    --s-blue:#3454D1;
    --s-amber:#B87A1E;
    --s-red:#C84B4B;
    --s-violet:#7856E0;
    --s-green:#2F9E6E;
    --s-orange:#C86A2D;
    --shadow-sm:0 1px 2px rgba(30,27,20,.06);
    --shadow-md:0 8px 24px rgba(30,27,20,.12);
    --shadow-lg:0 24px 64px rgba(20,18,12,.28);
    --radius:10px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161B;
      --surface:#1C1F26;
      --surface-2:#20232B;
      --border:#2C303A;
      --border-strong:#3A3F4B;
      --text:#EDEBE5;
      --text-muted:#ACA695;
      --text-faint:#96907E;
      --accent:#7C93EE;
      --accent-ink:#C4D0FA;
      --accent-soft:rgba(124,147,238,.16);
      --ring:rgba(124,147,238,.45);
      --danger:#E27E7E;
      --danger-soft:rgba(226,126,126,.14);
      --s-gray:#9A9481;
      --s-blue:#7C93EE;
      --s-amber:#E0A63C;
      --s-red:#E27E7E;
      --s-violet:#A594F2;
      --s-green:#4CC08C;
      --s-orange:#E8935A;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow-md:0 8px 24px rgba(0,0,0,.4);
      --shadow-lg:0 24px 64px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161B;
    --surface:#1C1F26;
    --surface-2:#20232B;
    --border:#2C303A;
    --border-strong:#3A3F4B;
    --text:#EDEBE5;
    --text-muted:#ACA695;
    --text-faint:#96907E;
    --accent:#7C93EE;
    --accent-ink:#C4D0FA;
    --accent-soft:rgba(124,147,238,.16);
    --ring:rgba(124,147,238,.45);
    --danger:#E27E7E;
    --danger-soft:rgba(226,126,126,.14);
    --s-gray:#9A9481;
    --s-blue:#7C93EE;
    --s-amber:#E0A63C;
    --s-red:#E27E7E;
    --s-violet:#A594F2;
    --s-green:#4CC08C;
    --s-orange:#E8935A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 8px 24px rgba(0,0,0,.4);
    --shadow-lg:0 24px 64px rgba(0,0,0,.55);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  h1,h2,h3,.display{font-family:"Manrope",system-ui,sans-serif;font-weight:800;text-wrap:balance;}
  button{font:inherit;color:inherit;}
  input,textarea,select{font:inherit;color:inherit;}
  a{color:inherit;}
  ::selection{background:var(--accent-soft);}
  svg{display:block;flex:none;}

  .icon{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .icon-sm{width:14px;height:14px;}

  /* ---------- App shell ---------- */
  #app{display:flex;min-height:100vh;background:var(--bg);}

  .sidebar{
    width:250px;flex:none;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 14px;gap:18px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
    transition:width .18s ease, padding .18s ease;
  }
  .sidebar.collapsed{width:0;min-width:0;padding:18px 0;border-right:none;overflow:hidden;}
  .brand{display:flex;align-items:center;gap:9px;padding:2px 6px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-ink));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow-sm);}
  .brand-mark svg{width:16px;height:16px;stroke:#fff;}
  .brand-name{font-family:"Manrope";font-weight:800;font-size:16.5px;letter-spacing:-.01em;}
  .brand-sub{font-size:10.5px;color:var(--text-faint);letter-spacing:.03em;text-transform:uppercase;margin-top:-2px;}

  .user-chip{display:flex;align-items:center;gap:8px;padding:8px 8px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);cursor:pointer;}
  .user-chip:hover{border-color:var(--border-strong);}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none;}
  .user-chip .who{min-width:0;}
  .user-chip .who-name{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-chip .who-role{font-size:11px;color:var(--text-faint);}

  .nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);padding:0 8px;margin-top:2px;}
  .pipe-list{display:flex;flex-direction:column;gap:2px;}
  .pipe-item{
    display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;
  }
  .pipe-item:hover{background:var(--surface-2);}
  .pipe-item:hover .pipe-rename{opacity:1;}
  .pipe-item.active{background:var(--accent-soft);border-color:var(--ring);}
  .pipe-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;}
  .pipe-item.active .pipe-name{color:var(--accent-ink);}
  .pipe-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer;}
  .pipe-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13.2px;}
  .pipe-sync{font-size:9.8px;color:var(--text-faint);display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pipe-sync svg{width:10px;height:10px;flex:none;}
  .pipe-sync.live{color:var(--s-green);}
  .pipe-count{font-size:11px;font-weight:600;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:1px 7px;font-family:"IBM Plex Mono";flex:none;}
  .pipe-item.active .pipe-count{background:var(--surface);color:var(--accent-ink);border-color:var(--ring);}
  .pipe-rename{opacity:0;flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;}
  .pipe-rename:hover{background:var(--surface);color:var(--text);}
  .pipe-rename svg{width:12px;height:12px;}
  .pipe-gear{opacity:0;flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;}
  .pipe-gear:hover{background:var(--surface);color:var(--text);}
  .pipe-gear svg{width:12px;height:12px;}
  .pipe-item:hover .pipe-gear{opacity:1;}
  .pipe-add{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:8px;color:var(--text-muted);cursor:pointer;border:1px dashed var(--border-strong);font-size:12.6px;font-weight:600;}
  .pipe-add:hover{color:var(--text);border-color:var(--accent);}

  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;}
  .quota-bar{height:5px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;}
  .quota-fill{height:100%;background:var(--accent);}
  .quota-text{font-size:10.5px;color:var(--text-faint);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  .topbar{
    display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--border);
    background:var(--surface);flex-wrap:wrap;
  }
  .topbar h1{font-size:19px;margin:0;flex:none;max-width:38vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-spacer{flex:1;}
  .search-box{
    display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:9px;padding:7px 11px;width:230px;color:var(--text-muted);
  }
  .search-box input{background:transparent;border:none;outline:none;width:100%;color:var(--text);font-size:13px;}
  .search-box svg{color:var(--text-faint);}
  .iconbtn{
    display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;
    border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text-muted);flex:none;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--border-strong);}
  .iconbtn.active{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--ring);}
  .iconbtn:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .card:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;
  }
  .btn:hover{border-color:var(--border-strong);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);}
  .btn-ghost{border-color:transparent;background:transparent;}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--border);}
  .btn-danger{color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:12.3px;}

  .view-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;flex:none;}
  .view-toggle button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:var(--surface);color:var(--text-muted);cursor:pointer;}
  .view-toggle button+button{border-left:1px solid var(--border);}
  .view-toggle button.active{background:var(--accent-soft);color:var(--accent-ink);}

  /* ---------- Board ---------- */
  .board-wrap{flex:1;overflow:auto;padding:16px 22px 22px;}
  .board{display:flex;gap:14px;align-items:flex-start;min-height:100%;}
  .column{
    width:288px;flex:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
    display:flex;flex-direction:column;max-height:100%;
  }
  .column.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft);}
  .column-head{
    display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:var(--surface-2);border-radius:var(--radius) var(--radius) 0 0;
  }
  .status-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot-gray{background:var(--s-gray);} .dot-blue{background:var(--s-blue);} .dot-amber{background:var(--s-amber);}
  .dot-red{background:var(--s-red);} .dot-violet{background:var(--s-violet);} .dot-green{background:var(--s-green);}
  .dot-orange{background:var(--s-orange);}
  .column-title{flex:1;min-width:0;font-weight:700;font-size:12.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .column-count{font-size:10.8px;font-family:"IBM Plex Mono";color:var(--text-faint);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 7px;flex:none;}
  .column-body{padding:9px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px;}
  .column-empty{font-size:11.8px;color:var(--text-faint);text-align:center;padding:18px 6px;border:1px dashed var(--border);border-radius:8px;}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 11px;cursor:pointer;
    box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:5px;
  }
  .card:hover{border-color:var(--border-strong);}
  .card[draggable="true"]{cursor:grab;}
  .card.dragging{opacity:.4;}
  .card-name{font-weight:600;font-size:13.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-meta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-faint);}
  .card-meta svg{width:12px;height:12px;}

  /* ---------- List view ---------- */
  .list-wrap{flex:1;overflow:auto;padding:16px 22px 22px;}
  table.leadtable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .leadtable th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);position:sticky;top:0;}
  .leadtable td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  .leadtable tr:last-child td{border-bottom:none;}
  .leadtable tr{cursor:pointer;}
  .leadtable tr:hover td{background:var(--surface-2);}
  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 7px;border-radius:20px;border:1px solid var(--border);font-size:11.6px;font-weight:600;white-space:nowrap;}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:60px 20px;color:var(--text-muted);}
  .empty-state svg{width:38px;height:38px;color:var(--text-faint);}
  .empty-state h3{font-size:16px;}
  .empty-state p{max-width:360px;font-size:13px;}

  /* ---------- Modal shared ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,18,13,.5);display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:100;
  }
  .modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--border);}
  .modal-sm{width:100%;max-width:420px;}
  .modal-md{width:100%;max-width:520px;}
  .modal-lg{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;}

  /* ---------- Lead detail modal ---------- */
  .lead-modal{width:100%;max-width:980px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;}
  .lead-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .lead-name-input{
    font-family:"Manrope";font-weight:800;font-size:17px;border:1px solid transparent;background:transparent;
    padding:5px 7px;border-radius:7px;min-width:120px;max-width:260px;
  }
  .lead-name-input:hover{border-color:var(--border);}
  .lead-name-input:focus{border-color:var(--accent);outline:none;background:var(--surface-2);}
  .status-select-wrap{position:relative;}
  .status-trigger{
    display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface-2);cursor:pointer;font-weight:600;font-size:12.5px;
  }
  .status-menu{
    position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-md);padding:5px;width:260px;max-height:320px;overflow-y:auto;z-index:20;
  }
  .status-menu button{
    width:100%;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;border:none;background:none;
    cursor:pointer;font-size:12.8px;text-align:left;
  }
  .status-menu button:hover{background:var(--surface-2);}
  .status-menu button.current{background:var(--accent-soft);color:var(--accent-ink);}
  .lead-head-spacer{flex:1;}
  .chip-group{display:flex;align-items:center;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface-2);}
  .chip-half{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;font-size:12.3px;}
  .chip-half:hover{background:var(--accent-soft);color:var(--accent-ink);}
  .chip-half.text{font-family:"IBM Plex Mono";border-left:1px solid var(--border);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chip-empty{color:var(--text-faint);font-style:normal;}
  .kebab-wrap{position:relative;}
  .kebab-menu{
    position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-md);padding:5px;width:190px;z-index:20;
  }
  .kebab-menu button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;border:none;background:none;cursor:pointer;font-size:12.8px;text-align:left;}
  .kebab-menu button:hover{background:var(--surface-2);}
  .kebab-menu button.danger{color:var(--danger);}
  .kebab-menu hr{border:none;border-top:1px solid var(--border);margin:5px 0;}

  .lead-body{display:flex;flex:1;min-height:0;overflow:hidden;}
  .lead-left{width:320px;flex:none;border-right:1px solid var(--border);padding:14px 16px;overflow-y:auto;}
  .lead-right{flex:1;min-width:0;padding:14px 18px;overflow-y:auto;display:flex;flex-direction:column;}
  .field-row{border-bottom:1px solid var(--border);padding:9px 2px;}
  .field-row:last-child{border-bottom:none;}
  .field-label{font-size:10.6px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:4px;}
  .field-value{
    border:1px solid transparent;background:transparent;width:100%;padding:3px 5px;border-radius:6px;font-size:13.3px;
    resize:none;min-height:22px;overflow:hidden;line-height:1.4;font-family:inherit;
    white-space:nowrap;text-overflow:ellipsis;
  }
  .field-value:hover{border-color:var(--border);}
  .field-value:focus{border-color:var(--accent);outline:none;background:var(--surface-2);white-space:pre-wrap;text-overflow:clip;}
  .field-value::placeholder{color:var(--text-faint);}
  .add-field-btn{display:flex;align-items:center;gap:7px;color:var(--text-muted);font-size:12.6px;font-weight:600;padding:8px 5px;cursor:pointer;}
  .add-field-btn:hover{color:var(--accent);}

  .desc-box{
    width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 11px;font-size:13px;resize:none;
    min-height:52px;background:var(--surface-2);overflow:hidden;
  }
  .desc-box:focus{outline:none;border-color:var(--accent);background:var(--surface);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 12px;}
  .tab{padding:8px 4px;font-size:12.8px;font-weight:600;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.active{color:var(--accent-ink);border-color:var(--accent);}

  .note-input{width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 11px;font-size:13px;resize:vertical;min-height:38px;background:var(--surface-2);}
  .note-input:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  .note-hint{font-size:11px;color:var(--text-faint);margin-top:4px;}

  .timeline{margin-top:14px;display:flex;flex-direction:column;gap:14px;}

  function promptRenameProfile(){
    openFormModal({
      title: 'Namen ändern',
      sub: 'Dein Name erscheint künftig bei Notizen und Statusänderungen.',
      fields: [{key:'name', label:'Name', value: authorName(), placeholder:'z. B. Amina'}],

      onSubmit: function(vals){
        if(!vals.name || !vals.name.trim()) return;

          userProfile = Object.assign({}, userProfile, {displayName: name});

  function openChangePasswordModal(){
    var root = document.getElementById('modalRoot');
    var overlay = el('div', 'overlay');
    var modal = el('div', 'modal modal-md form-modal');
    modal.innerHTML =
      '<h2 class="form-title">Passwort ändern</h2>' +
      '<p class="form-sub">Zur Sicherheit bitte zuerst dein aktuelles Passwort bestätigen.</p>' +
      '<div class="form-row"><label>Aktuelles Passwort</label><input type="password" id="cp_current" autocomplete="current-password"></div>' +
      '<div class="form-row"><label>Neues Passwort (mind. 6 Zeichen)</label><input type="password" id="cp_new" autocomplete="new-password"></div>' +
      '<div class="form-row"><label>Neues Passwort wiederholen</label><input type="password" id="cp_new2" autocomplete="new-password"></div>' +
      '<div id="cpError" class="login-error" hidden></div>' +
      '<div class="form-actions"><button class="btn btn-ghost" id="cpCancel">Abbrechen</button>' +
        '<button class="btn btn-primary" id="cpSubmit">Passwort speichern</button></div>';
    overlay.appendChild(modal);
    root.innerHTML = '';
    root.appendChild(overlay);
    overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) root.innerHTML=''; });
    modal.querySelector('#cpCancel').addEventListener('click', function(){ root.innerHTML=''; });
    var firstInput = modal.querySelector('#cp_current');
    setTimeout(function(){ firstInput.focus(); }, 30);
    modal.querySelector('#cpSubmit').addEventListener('click', function(){
      var current = modal.querySelector('#cp_current').value;
      var next = modal.querySelector('#cp_new').value;
      var next2 = modal.querySelector('#cp_new2').value;
      var errBox = modal.querySelector('#cpError');
      errBox.hidden = true;
      if(!current){ errBox.textContent = 'Bitte dein aktuelles Passwort eingeben.'; errBox.hidden = false; return; }
      if(next.length < 6){ errBox.textContent = 'Das neue Passwort muss mindestens 6 Zeichen haben.'; errBox.hidden = false; return; }
      if(next !== next2){ errBox.textContent = 'Die beiden neuen Passwörter stimmen nicht überein.'; errBox.hidden = false; return; }
      var btn = modal.querySelector('#cpSubmit');
      btn.disabled = true; btn.textContent = 'Wird gespeichert …';
      var cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, current);
      currentUser.reauthenticateWithCredential(cred).then(function(){
        return currentUser.updatePassword(next);
      }).then(function(){
        root.innerHTML = '';
        toast('Passwort aktualisiert');
      }).catch(function(err){
        errBox.textContent = authErrorMessage(err);
        errBox.hidden = false;
        btn.disabled = false; btn.textContent = 'Passwort speichern';
      });
    });

  function renderTeamList(){

  // Creates a new team member's Firebase Auth account without signing the admin out,
  // by using a throwaway secondary Firebase App instance for the sign-up call.
  function createTeamMember(email, password, displayName){
    var secondaryName = 'secondary-' + Date.now();
    var secondaryApp = firebase.initializeApp(firebaseConfig, secondaryName);
    var secondaryAuth = secondaryApp.auth();
    return secondaryAuth.createUserWithEmailAndPassword(email, password).then(function(cred){
      var newUid = cred.user.uid;
      return db.doc('users/' + newUid).set({
        email: email, displayName: (displayName || email.split('@')[0]),
        role: (email.trim().toLowerCase() === ADMIN_EMAIL) ? 'admin' : 'member',
        createdAt: nowIso(), createdBy: currentUser.email
      }).then(function(){ return secondaryAuth.signOut(); });
    }).then(function(){
      return secondaryApp.delete();
    }, function(err){
      secondaryApp.delete().catch(function(){});
      throw err;
    });
  }

  function authErrorMessage(err){
    var code = err && err.code;
    var map = {
      'auth/email-already-in-use': 'Diese E-Mail-Adresse hat schon ein Konto.',
      'auth/invalid-email': 'Ungültige E-Mail-Adresse.',
      'auth/weak-password': 'Das Passwort ist zu schwach (mind. 6 Zeichen).',
      'auth/wrong-password': 'Falsches Passwort.',
      'auth/user-not-found': 'Kein Konto mit dieser E-Mail-Adresse gefunden.',
      'auth/invalid-credential': 'E-Mail oder Passwort ist falsch.',
      'auth/too-many-requests': 'Zu viele Versuche. Bitte kurz warten und erneut versuchen.',
      'auth/network-request-failed': 'Keine Verbindung — bitte Internetverbindung prüfen.',
      'auth/requires-recent-login': 'Aus Sicherheitsgründen bitte zuerst das aktuelle Passwort bestätigen.',
      'auth/missing-email': 'Bitte zuerst die E-Mail-Adresse oben eingeben.'
    };
    return (code && map[code]) || (err && err.message) || 'Unbekannter Fehler.';
  }

  /* ============================================================
     Firebase init, Auth-Gate & Boot
     ============================================================ */
  function initAuth(){
    db = firebase.firestore();
    auth = firebase.auth();

    document.getElementById('userChip').addEventListener('click', toggleProfileMenu);
    document.getElementById('userChip').addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') toggleProfileMenu(); });

    var loginBtn = document.getElementById('loginSubmit');
    var emailInput = document.getElementById('loginEmail');
    var pwInput = document.getElementById('loginPassword');
    var errBox = document.getElementById('loginError');
    function doLogin(){
      var email = emailInput.value.trim();
      var pw = pwInput.value;
      errBox.hidden = true;
      if(!email || !pw){ errBox.textContent = 'Bitte E-Mail und Passwort eingeben.'; errBox.hidden = false; return; }
      loginBtn.disabled = true; loginBtn.textContent = 'Anmelden …';
      auth.signInWithEmailAndPassword(email, pw).catch(function(err){
        errBox.textContent = authErrorMessage(err);
        errBox.hidden = false;
      }).then(function(){
        loginBtn.disabled = false; loginBtn.textContent = 'Anmelden';
      });
    }
    loginBtn.addEventListener('click', doLogin);
    pwInput.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
    emailInput.addEventListener('keydown', function(e){ if(e.key==='Enter') pwInput.focus(); });

    document.getElementById('loginForgotBtn').addEventListener('click', function(){
      var email = emailInput.value.trim();
      errBox.hidden = true;
      if(!email){
        errBox.textContent = 'Bitte zuerst deine E-Mail-Adresse oben eingeben, dann auf „Passwort vergessen?“ klicken.';
        errBox.hidden = false;
        emailInput.focus();
        return;
      }
      var forgotBtn = document.getElementById('loginForgotBtn');
      forgotBtn.disabled = true;
      auth.sendPasswordResetEmail(email).then(function(){
        errBox.style.color = 'var(--success, #1a7f4e)';
        errBox.textContent = 'E-Mail zum Zurücksetzen wurde an ' + email + ' gesendet. Bitte Posteingang (auch Spam) prüfen.';
        errBox.hidden = false;
      }).catch(function(err){
        errBox.style.color = '';
        errBox.textContent = authErrorMessage(err);
        errBox.hidden = false;
      }).then(function(){
        forgotBtn.disabled = false;
      });
    });

    auth.onAuthStateChanged(function(user){
      if(unsubLeads){ unsubLeads(); unsubLeads = null; }
      if(user){
        currentUser = user;
        ensureUserProfile(user).then(function(profile){
          userProfile = profile;
          isAdmin = profile.role === 'admin';
          document.getElementById('loginScreen').hidden = true;
          document.getElementById('app').hidden = false;
          renderUserChip();
          boot();
        }).catch(function(err){
          console.error('ensureUserProfile failed', err);
          errBox.textContent = 'Anmeldung hat funktioniert, aber der Zugriff auf die Datenbank wurde verweigert' +
            (err && err.code ? (' (' + err.code + ')') : '') + '. Bitte in der Firebase-Konsole prüfen: 1) Firestore Database wurde erstellt, 2) die Sicherheitsregeln erlauben "if request.auth != null".';
          errBox.hidden = false;
          auth.signOut();
        });
      } else {
        currentUser = null; userProfile = null; isAdmin = false;
        document.getElementById('loginScreen').hidden = false;
        document.getElementById('app').hidden = true;
        pwInput.value = '';
        setTimeout(function(){ emailInput.focus(); }, 30);
      }
    });
  }

  function ensureUserProfile(user){
    var ref = db.doc('users/' + user.uid);
    return ref.get().then(function(snap){
      if(snap.exists) return snap.data();
      var profile = {
        email: user.email,
        displayName: (user.email || 'Nutzer').split('@')[0],
        role: (user.email && user.email.trim().toLowerCase() === ADMIN_EMAIL) ? 'admin' : 'member',
        createdAt: nowIso(), createdBy: 'self'
      };
      return ref.set(profile).then(function(){ return profile; });
    });
  }

  function showFatal(msg){
    document.getElementById('app').innerHTML =
      '<div class="empty-state" style="width:100%;margin:auto;">' +
      '<svg viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" fill="none"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>' +
      '<h3>Nicht verfügbar</h3><p>' + esc(msg) + '</p></div>';
  }

  function boot(){
    ensurePipelines().then(function(){
      renderSidebar();
      var savedView = null, savedPipe = null;
      try{ savedView = localStorage.getItem('finanziacrm_view'); savedPipe = localStorage.getItem('finanziacrm_pipeline'); }catch(e){}
      viewMode = savedView === 'list' ? 'list' : 'board';
      updateViewToggle();
      selectPipeline((savedPipe && pipelines[savedPipe]) ? savedPipe : pipelineOrder[0]);
      watchDbSize();
      subscribeSyncSources();
      subscribeTeamUsers();
      startAutoSync();
    });
  }

  function ensurePipelines(){
    var jobs = SEED_PIPELINES.map(function(seed){
      var ref = db.doc('pipelines/' + seed.id);
      return ref.get().then(function(snap){
        if(!snap.exists){
          return ref.set({
            name: seed.name, order: seed.order, fields: seed.fields,
            columns: COLUMN_TEMPLATE.map(function(c){ return {id:c.id, name:c.name, color:c.color}; }),
            createdAt: nowIso()
          });
        }
      });
    });
    return Promise.all(jobs).then(function(){ return subscribePipelines(); });
  }

  function subscribePipelines(){
    return db.collection('pipelines').orderBy('order','asc').get().then(function(snap){
      pipelines = {}; pipelineOrder = [];
      snap.docs.forEach(function(d){
        pipelines[d.id] = d.data();
        pipelineOrder.push(d.id);
      });
      db.collection('pipelines').onSnapshot(function(qs){
        var changed = false;
        qs.docs.forEach(function(d){
          if(!pipelines[d.id]) { pipelineOrder.push(d.id); changed = true; }
          pipelines[d.id] = d.data();
        });
        pipelineOrder = pipelineOrder.filter(function(id){ return qs.docs.some(function(d){ return d.id === id; }); });
        pipelineOrder.sort(function(a,b){ return (pipelines[a].order||0) - (pipelines[b].order||0); });
        renderSidebar();
        if(currentPipelineId) document.getElementById('pipelineTitle').textContent = pipelines[currentPipelineId].name;
        renderLeadDetailIfOpen();
      });
    });
  }

  function watchDbSize(){
    // Informational document count (Firestore's free Spark tier has no fixed document cap —
    // limits are on daily reads/writes instead — so this is just a running total, not a quota).
    function refresh(){
      Promise.all([
        db.collection('leads').get().catch(function(){ return {size:0}; }),
        db.collection('history').get().catch(function(){ return {size:0}; })
      ]).then(function(r){
        var count = r[0].size + r[1].size + pipelineOrder.length;
        totalDocCount = count;
        document.getElementById('quotaFill').style.width = '100%';
        document.getElementById('quotaText').textContent = count.toLocaleString('de-DE') + ' Einträge in der Datenbank';
      });
    }
    refresh();
    setInterval(refresh, 60000);
  }

  function syncInfoForPipeline(pipelineId){
    var ids = Object.keys(syncSources);
    for(var i=0;i<ids.length;i++){
      var s = syncSources[ids[i]];
      if(s.pipelineId === pipelineId){
        return {label: s.lastSyncedAt ? ('Sync ' + fmtRelative(s.lastSyncedAt)) : 'Sync eingerichtet'};
      }
    }
    return null;
  }

  function renamePipeline(id){
    openFormModal({
      title:'Kampagne umbenennen',
      fields:[{key:'name', label:'Name', value: pipelines[id].name}],
      submitLabel:'Speichern',
      onSubmit: function(vals){
        if(!vals.name || !vals.name.trim()) return;
        db.doc('pipelines/' + id).update({name: vals.name.trim()}).then(function(){ toast('Umbenannt'); });
      }
    });
  }

  /* ============================================================
     Kampagne-Einstellungen (Löschen / Google-Sheets-Sync verbinden)
     ============================================================ */
  function parseSheetId(url){
    var m = /\/d\/([a-zA-Z0-9_-]{15,})/.exec(url || '');
    return m ? m[1] : null;
  }

  function existingSyncSourceFor(pipelineId){
    var ids = Object.keys(syncSources);
    for(var i=0;i<ids.length;i++){
      if(syncSources[ids[i]].pipelineId === pipelineId) return Object.assign({_docId: ids[i]}, syncSources[ids[i]]);
    }
    return null;
  }

  function openPipelineSettings(id){
    var p = pipelines[id];
    var existing = existingSyncSourceFor(id);
    var fieldMap = (existing && existing.fieldMap) || [];
    function mapped(type, customKey){
      var f = fieldMap.filter(function(m){ return m.targetType === type && (!customKey || m.customKey === customKey); })[0];
      return f ? f.headerMatch : '';
    }

    var root = document.getElementById('modalRoot');
    var overlay = el('div', 'overlay');
    var modal = el('div', 'modal modal-lg form-modal');

    var customFieldsHtml = (p.fields || []).map(function(f){
      return '<div class="form-row"><label>Spalte für „' + esc(f.label) + '“ (optional)</label>' +
        '<input type="text" id="cf_' + esc(f.key) + '" value="' + esc(mapped('custom', f.key)) + '" placeholder="genauer Spaltenname in der Tabelle"></div>';
    }).join('');

    var statusOptions = (p.columns || COLUMN_TEMPLATE).map(function(c){
      return '<option value="' + esc(c.id) + '"' + (existing && existing.newLeadStatusId === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');

    var statusNote = '';
    if(existing){
      if(existing.lastSyncError){
        statusNote = '<p class="sync-status-note err">⚠ Letzter Sync-Fehler: ' + esc(existing.lastSyncError) + '</p>';
      } else {
        statusNote = '<p class="sync-status-note">Zuletzt synchronisiert: ' + (existing.lastSyncedAt ? esc(fmtRelative(existing.lastSyncedAt)) : 'noch nie') +
          (existing.lastSyncedAt ? (' · ' + (existing.lastNewLeadsCount == null ? 0 : existing.lastNewLeadsCount) + ' neue Leads beim letzten Lauf') : '') + '</p>';
      }
    }

    modal.innerHTML =
      '<h2 class="form-title">Einstellungen: ' + esc(p.name) + '</h2>' +
      '<div class="settings-section" style="border-top:none;margin-top:0;padding-top:0;">' +
        '<h3>Automatischer Import aus Google Sheets</h3>' +
        '<p class="form-hint" style="margin:0 0 10px;">Google blockiert den direkten Browser-Zugriff auf Tabellen meistens (CORS). Der zuverlässige Weg ist ein kleines Apps-Script in der Tabelle selbst — Anleitung: In der Google-Tabelle → Erweiterungen → Apps Script → Code aus der Anleitung einfügen (frag mich danach) → Bereitstellen → Web-App → Zugriff „Alle" → die entstehende URL hier unten eintragen.</p>' +

  /* ============================================================
     Google Sheets sync engine — runs entirely in the browser.
     Fetches the sheet's public CSV export (works when the sheet is shared
     as "Anyone with the link can view"), matches columns against fieldMap,
     and creates leads that don't already exist yet (deduplicated by a
     stable id derived from the sheet's own "id" column, or from
     name+phone+email when there is no id column).
     ============================================================ */
  function gvizCsvUrl(fileId, tabName){
    var url = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(fileId) + '/gviz/tq?tqx=out:csv';
    if(tabName) url += '&sheet=' + encodeURIComponent(tabName);
    return url;
  }
  // Preferred fetch path: a small Google Apps Script "Web App" bound to the sheet, deployed
  // with "Anyone" access. Unlike Google's own export endpoints, Apps Script Web Apps reliably
  // send permissive CORS headers, so this works even when the gviz export gets blocked by the
  // browser as a cross-origin request (this happens more often than not in practice).
  function appsScriptCsvUrl(baseUrl, tabName){
    var sep = baseUrl.indexOf('?') === -1 ? '?' : '&';
    return baseUrl + (tabName ? (sep + 'sheet=' + encodeURIComponent(tabName)) : '');
  }

  // Normalizes header text for comparison: trims, lowercases, strips zero-width/BOM
  // characters that sometimes sneak into exported sheets, and normalizes Unicode so
  // e.g. Arabic headers typed into the settings form still match the sheet's own headers
  // even if they were entered with a different (but visually identical) Unicode form.
  function normHeaderText(s){
    return (s||'').normalize('NFKC').replace(/[​-‏﻿]/g,'').trim().toLowerCase();
  }

  function processSheetCsv(src, csvText){
    if(/^\s*</.test(csvText)){
      // Google returned an HTML page (e.g. a login/"request access" page) instead of CSV —
      // this means the sheet is not actually shared as "Anyone with the link can view".
      return Promise.reject(new Error('Die Tabelle hat keine CSV-Daten zurückgegeben, sondern eine HTML-Seite (vermutlich ein Login/Freigabe-Hinweis). Bitte in Google Sheets auf "Teilen" → "Jeder mit dem Link" → "Betrachter" stellen.'));
    }
    var lines = csvText.split(/\r?\n/).filter(function(l){ return l.trim() !== ''; });
    if(lines.length < 2) return Promise.resolve({count:0, headers:[], rowCount: lines.length});
    var rows = lines.map(function(l){ return parseCsvLine(l, [',']); });
    var headers = rows[0].map(function(h){ return h.trim(); });
    var headersLower = headers.map(normHeaderText);
    var dataRows = rows.slice(1);

    function colIndex(headerMatch){ return headersLower.indexOf(normHeaderText(headerMatch)); }
    var idIdx = headersLower.indexOf('id');
    var fieldMap = src.fieldMap || [];

    return db.collection('leads').where('pipelineId','==',src.pipelineId).get().then(function(snap){
      var existingIds = {};
      snap.docs.forEach(function(d){ existingIds[d.id] = true; });

      var toCreate = [];
      dataRows.forEach(function(cells){
        var rawId = idIdx > -1 ? (cells[idIdx]||'').trim() : '';
        if(!rawId){
          rawId = fieldMap.filter(function(m){ return ['name','phone','email'].indexOf(m.targetType) !== -1; })
            .map(function(m){ var ci = colIndex(m.headerMatch); return ci > -1 ? (cells[ci]||'').trim().toLowerCase() : ''; })
            .join('|');
        }
        if(!rawId || !rawId.replace(/\|/g,'')) return;
        var docId = 'l:' + rawId.replace(/[^a-zA-Z0-9_\-.:@+|]/g, '_').slice(0,140);
        if(existingIds[docId]) return;

        var pipe = pipelines[src.pipelineId];
        var defaultStatus = src.newLeadStatusId || ((pipe && pipe.columns && pipe.columns[0]) ? pipe.columns[0].id : COLUMN_TEMPLATE[0].id);
        var lead = {pipelineId: src.pipelineId, statusId: defaultStatus, name:'', email:'', phone:'', custom:{}, description:'', createdAt: nowIso(), updatedAt: nowIso()};
        var statusNote = '';
        fieldMap.forEach(function(m){
          var ci = colIndex(m.headerMatch);
          if(ci === -1) return;
          var val = (cells[ci]||'').trim();
          if(!val) return;
          if(m.targetType === 'name') lead.name = val;
          else if(m.targetType === 'phone') lead.phone = cleanPhoneValue(val);
          else if(m.targetType === 'email') lead.email = val;
          else if(m.targetType === 'adName') lead.description = (lead.description ? lead.description + '\n' : '') + 'Anzeige: ' + val;
          else if(m.targetType === 'leadStatusNote') statusNote = val;
          else if(m.targetType === 'custom' && m.customKey) lead.custom[m.customKey] = val;
        });
        if(!lead.name) return;
        existingIds[docId] = true;
        toCreate.push({docId: docId, lead: lead, statusNote: statusNote});
      });

      if(toCreate.length === 0) return {count:0, headers: headers, rowCount: dataRows.length};

      var idx = 0;
      function nextChunk(){
        var chunk = toCreate.slice(idx, idx + 15);
        if(chunk.length === 0) return Promise.resolve();
        return Promise.all(chunk.map(function(item){
          return db.doc('leads/' + item.docId).set(item.lead).then(function(){
            var jobs = [logHistory(item.docId, src.pipelineId, {type:'note', text:'Lead automatisch aus Google Sheets importiert'})];
            if(item.statusNote) jobs.push(logHistory(item.docId, src.pipelineId, {type:'note', text:'Status aus Sheet: ' + item.statusNote}));
            return Promise.all(jobs);
          });
        })).then(function(){ idx += 15; return nextChunk(); });
      }
      return nextChunk().then(function(){ return {count: toCreate.length, headers: headers, rowCount: dataRows.length}; });
    });
  }

  function runSyncForSource(sourceDocId, src){
    var tabs = (src.sheetTabs && src.sheetTabs.length) ? src.sheetTabs : [null];
    var totalNew = 0, totalRows = 0, lastHeadersSeen = null;
    var usingAppsScript = !!(src.appsScriptUrl && src.appsScriptUrl.trim());
    var chain = Promise.resolve();
    tabs.forEach(function(tab){
      chain = chain.then(function(){
        var url = usingAppsScript ? appsScriptCsvUrl(src.appsScriptUrl.trim(), tab) : gvizCsvUrl(src.driveFileId, tab);
        return fetch(url).then(function(res){
          if(!res.ok) throw new Error('Tabelle nicht erreichbar (HTTP ' + res.status + ').');
          return res.text();
        }).then(function(text){
          if(!usingAppsScript) return text;
          if(text.indexOf('ERROR:') === 0) throw new Error('Apps-Script meldet: ' + text.slice(6).trim());
          return text;
        }).then(function(csvText){
          return processSheetCsv(src, csvText);
        }).then(function(result){
          totalNew += result.count;
          totalRows += result.rowCount;
          if(result.headers && result.headers.length) lastHeadersSeen = result.headers;
        });
      });
    });
    return chain.then(function(){
      var errMsg = null;
      if(totalNew === 0 && totalRows > 0){
        // The sheet was reached and had rows, but nothing matched — almost always means the
        // column names configured in "Kampagne-Einstellungen" don't exactly match the sheet's
        // actual header row (or every row was already imported before).
        errMsg = 'Tabelle erreicht (' + totalRows + ' Zeile(n) geprüft), aber 0 neue Leads gefunden — entweder sind alle bereits importiert, oder die Spaltennamen stimmen nicht exakt mit der Tabelle überein.' +
          (lastHeadersSeen ? (' Spaltenüberschriften in der Tabelle: ' + lastHeadersSeen.join(' | ')) : '');
      } else if(totalRows === 0){
        errMsg = 'Tabelle erreicht, aber keine Datenzeilen gefunden (nur Kopfzeile oder leer). Prüfe Tab-Namen und ob dort wirklich Daten stehen.';
      }
      return db.doc('syncSources/' + sourceDocId).update({
        lastSyncedAt: nowIso(), lastNewLeadsCount: totalNew, lastSyncError: errMsg
      }).then(function(){ return {count: totalNew, error: errMsg}; });
    }).catch(function(err){
      console.error('Sheet sync failed for', sourceDocId, err);
      var msg = (err && err.message) || 'Unbekannter Fehler';
      if(!usingAppsScript && /fetch/i.test(msg)){
        msg = 'Der direkte Google-Sheets-Zugriff wurde vom Browser blockiert (CORS). Bitte richte stattdessen die Apps-Script-Web-App-URL ein (siehe Anleitung im Einstellungsdialog) — das ist der zuverlässige Weg.';
      }
      return db.doc('syncSources/' + sourceDocId).update({
        lastSyncedAt: nowIso(), lastSyncError: msg
      }).catch(function(){}).then(function(){ return {error: msg}; });
    });
  }

  var syncTimer = null;
  function runAllSyncs(){
    Object.keys(syncSources).forEach(function(sourceDocId){
      runSyncForSource(sourceDocId, syncSources[sourceDocId]);
    });
  }
  function startAutoSync(){
    if(syncTimer) clearInterval(syncTimer);
    // First run shortly after boot (gives subscribeSyncSources a moment to populate),
    // then every 5 minutes for as long as this tab stays open.
    setTimeout(runAllSyncs, 4000);
    syncTimer = setInterval(runAllSyncs, 5 * 60 * 1000);
  }

    unsubLeads = db.collection('leads').where('pipelineId','==',currentPipelineId).limit(3000)

  /* ============================================================

     ============================================================ */
  function renderBoard(){
    var board = document.getElementById('board');
    board.innerHTML = '';
    if(!currentPipelineId) return;
    var pipeline = pipelines[currentPipelineId];
    var ids = filteredLeadIds();
    var byCol = {};
    ids.forEach(function(id){
      var l = leads[id];
      (byCol[l.statusId] = byCol[l.statusId] || []).push(id);
    });

    (pipeline.columns || COLUMN_TEMPLATE).forEach(function(col){
      var colIds = (byCol[col.id] || []).slice().sort(function(a,b){
        return (leads[b].updatedAt || '').localeCompare(leads[a].updatedAt || '');
      });
      var colEl = el('div', 'column');
      colEl.dataset.colId = col.id;
      var head = el('div', 'column-head');
      head.innerHTML = colDot(col.color) +
        '<span class="column-title">' + esc(col.name) + '</span>' +
        '<span class="column-count">' + colIds.length + '</span>';
      colEl.appendChild(head);
      var body = el('div', 'column-body');
      if(colIds.length === 0){
        body.appendChild(el('div', 'column-empty', 'Keine Leads'));
      } else {
        colIds.forEach(function(id){ body.appendChild(renderCard(id, leads[id])); });
      }
      colEl.appendChild(body);

      colEl.addEventListener('dragover', function(e){ e.preventDefault(); colEl.classList.add('drop-hover'); });
      colEl.addEventListener('dragleave', function(){ colEl.classList.remove('drop-hover'); });
      colEl.addEventListener('drop', function(e){
        e.preventDefault(); colEl.classList.remove('drop-hover');
        var leadId = e.dataTransfer.getData('text/plain');
        if(leadId) moveLeadToStatus(leadId, col.id);
      });

      board.appendChild(colEl);
    });
  }

  function renderCard(id, l){
    var card = el('div', 'card');
    card.draggable = true;
    card.tabIndex = 0;
    card.dataset.id = id;
    card.innerHTML = '<div class="card-name">' + esc(l.name || '(ohne Namen)') + '</div>' +
      '<div class="card-meta"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>' +
      '<span class="mono">' + esc(fmtRelative(l.updatedAt || l.createdAt)) + '</span></div>';

  function parseCsvLine(line, delims){
    // delims: array of characters that separate fields, e.g. ['\t'] or [',', ';']
    var out = [], cur = '', inQ = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(inQ){
        if(c === '"'){ if(line[i+1] === '"'){ cur+='"'; i++; } else inQ = false; }
        else cur += c;
      } else {
        if(c === '"') inQ = true;
        else if(delims.indexOf(c) !== -1){ out.push(cur); cur=''; }
        else cur += c;
      }
    }
    out.push(cur);
    return out.map(function(s){ return s.trim(); });
  }

  function detectCsvDelims(firstLine){
    // Google-Sheets/Excel pastes are tab-separated — prefer tab whenever present,
    // since a comma/semicolon split would otherwise shred every field into the
    // wrong columns (this caused a real data-corruption incident on 2026-09-15).
    if(firstLine.indexOf('\t') !== -1) return ['\t'];
    return [',', ';'];
  }

  function runImport(raw){
    var lines = raw.split(/\r?\n/).map(function(l){ return l.replace(/\r$/, ''); }).filter(function(l){ return l.trim() !== ''; });
    if(lines.length === 0){ toast('Keine Zeilen gefunden'); return; }
    var delims = detectCsvDelims(lines[0]);
    var rows = lines.map(function(l){ return parseCsvLine(l, delims); });
    var first = rows[0].map(function(s){ return s.toLowerCase(); });
    // A real header row shouldn't contain anything that looks like actual contact data
    // (an "@" address or a mostly-digits phone number) — if it does, this is a data row,
    // not a header, and must NOT be discarded (this previously ate the first lead whenever
    // its email happened to contain "mail" as a substring, e.g. name@gmail.com).
    var looksLikeDataRow = rows[0].some(function(s){ return /@/.test(s); }) ||
      rows[0].some(function(s){ return /^[+()0-9][0-9()\-\s\/]{5,}$/.test((s||'').trim()); });
    var hasHeader = !looksLikeDataRow &&
      (first.some(function(s){ return s.indexOf('name') !== -1; }) || first.some(function(s){ return s.indexOf('mail') !== -1; }));
    var idxName = 0, idxEmail = 1, idxPhone = 2;
    var detectedNote = 'Spalten anhand Reihenfolge angenommen: 1=Name, 2=E-Mail, 3=Telefon.';
    if(hasHeader){
      idxName = first.findIndex(function(s){ return s.indexOf('name') !== -1; });
      idxEmail = first.findIndex(function(s){ return s.indexOf('mail') !== -1; });
      idxPhone = first.findIndex(function(s){ return s.indexOf('telefon') !== -1 || s.indexOf('tel') !== -1 || s.indexOf('phone') !== -1 || s.indexOf('nummer') !== -1; });
      rows = rows.slice(1);
      detectedNote = 'Kopfzeile erkannt — Name: ' + (idxName>-1?('Spalte '+(idxName+1)):'nicht gefunden') +
        ', E-Mail: ' + (idxEmail>-1?('Spalte '+(idxEmail+1)):'nicht gefunden') +
        ', Telefon: ' + (idxPhone>-1?('Spalte '+(idxPhone+1)):'nicht gefunden') + '.';
    }
    if(idxName === -1) idxName = 0;
    var col0 = (pipelines[currentPipelineId].columns || COLUMN_TEMPLATE)[0].id;
    var progress = document.getElementById('importProgress');
    progress.textContent = detectedNote;
    var i = 0, created = 0, skipped = 0, noName = 0;

    // Duplicate detection: a re-uploaded/overlapping CSV should only add genuinely new leads.
    // We match on normalized phone number or email against leads already loaded for this pipeline,
    // and also against rows created earlier in this same import run.
    function normPhone(p){ return (p||'').replace(/[^0-9]/g,''); }
    function normEmail(e){ return (e||'').trim().toLowerCase(); }
    var existingPhones = {}, existingEmails = {};
    Object.keys(leads).forEach(function(lid){
      var l = leads[lid];
      var np = normPhone(l.phone), ne = normEmail(l.email);
      if(np) existingPhones[np] = true;
      if(ne) existingEmails[ne] = true;
    });

    function step(){
      var chunk = rows.slice(i, i + 15);
      if(chunk.length === 0){
        var summary = created + ' importiert';
        if(skipped) summary += ', ' + skipped + ' Duplikate übersprungen';
        if(noName) summary += ', ' + noName + ' ohne erkannten Namen übersprungen';
        progress.textContent = detectedNote + ' ' + summary + '.';
        toast(summary);
        setTimeout(function(){ document.getElementById('modalRoot').innerHTML=''; }, 1400);
        return;
      }
      Promise.all(chunk.map(function(cells){
        var name = (cells[idxName] || '').trim();
        if(!name){ noName++; return Promise.resolve(); }
        var email = idxEmail > -1 ? (cells[idxEmail]||'').trim() : '';
        var phone = idxPhone > -1 ? cleanPhoneValue(cells[idxPhone]) : '';
        var np = normPhone(phone), ne = normEmail(email);
        if((np && existingPhones[np]) || (ne && existingEmails[ne])){
          skipped++;
          return Promise.resolve();
        }
        if(np) existingPhones[np] = true;
        if(ne) existingEmails[ne] = true;
        var id = uid(); var ts = nowIso();
        return db.doc('leads/' + id).set({
          pipelineId: currentPipelineId, statusId: col0, name: name, email: email, phone: phone,
          custom:{}, description:'', createdAt: ts, updatedAt: ts
        }).then(function(){
          created++;
          return logHistory(id, currentPipelineId, {type:'note', text:'Lead per CSV-Import angelegt'});
        });
      })).then(function(){
        i += 15;
        progress.textContent = 'Importiere … ' + Math.min(i, rows.length) + ' / ' + rows.length;
        step();
      });
    }
    step();
  }

  function logHistory(leadId, pipelineId, entry){
    var body = Object.assign({
      leadId: leadId, pipelineId: pipelineId, author: authorName(),
      authorEmail: (currentUser && currentUser.email) || '', ts: nowIso()
    }, entry);
    return db.collection('history').add(body);

  // Combines display name + email into one unambiguous label for the timeline, e.g.
  // "Amina · amina@example.de" — falls back gracefully for older entries that only have a name.
  function authorLabel(h){
    var name = h.author || 'Unbekannt';
    if(h.authorEmail && h.authorEmail.toLowerCase() !== name.toLowerCase()) return name + ' · ' + h.authorEmail;
    return h.authorEmail || name;
  }

  function openLead(id){
    activeLeadId = id;
    activeTab = 'verlauf';
    statusMenuOpen = false; kebabMenuOpen = false;
    historyEntries = [];
    renderLeadDetail();
    if(unsubHistory) unsubHistory();
    // Same reasoning as the leads listener: no server-side orderBy, sort client-side instead,
    // so this never needs a Firestore composite index.
    unsubHistory = db.collection('history').where('leadId','==',id).limit(500)
      .onSnapshot(function(qs){
        historyEntries = qs.docs.map(function(d){ return Object.assign({id: d.id}, d.data()); }).sort(function(a,b){
          return (a.ts||'').localeCompare(b.ts||'');
        });
        renderTimeline();
      }, function(err){
        console.error(err);
        toast('Verlauf konnte nicht geladen werden (' + (err && err.code ? err.code : 'Fehler') + ')');
      });
  }

  function closeLead(){
    activeLeadId = null;
    if(unsubHistory){ unsubHistory(); unsubHistory = null; }
    document.getElementById('modalRoot').innerHTML = '';

  // Klick/Fokus lässt ein Text-/Notizfeld auf seine volle Höhe wachsen, damit auch lange
  // Werte (z. B. "Finanzthema(n)") komplett sichtbar sind; beim Verlassen zieht es sich
  // wieder auf eine kompakte Zeile zusammen.
  function autoGrowTextarea(ta){
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }
  function wireAutoGrow(ta){
    ta.addEventListener('focus', function(){ autoGrowTextarea(ta); });
    ta.addEventListener('input', function(){ autoGrowTextarea(ta); });
    ta.addEventListener('blur', function(){ ta.style.height = ''; });
  }

  function fieldRow(label, value, onSave, type){
    var row = el('div', 'field-row');
    row.appendChild(el('div', 'field-label', esc(label)));
    var input = document.createElement('textarea');
    input.rows = 1;
    input.className = 'field-value';
    input.placeholder = 'Hier eingeben';
    input.value = value || '';
    input.addEventListener('blur', function(){ onSave(input.value); });
    input.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); input.blur(); } });
    wireAutoGrow(input);
    row.appendChild(input);
    return row;
  }

  function saveLeadField(key, value){
    if(!activeLeadId) return;
    if(key === 'phone') value = cleanPhoneValue(value);
    var patch = {updatedAt: nowIso()};
    patch[key] = value;
    db.doc('leads/' + activeLeadId).update(patch);
    leads[activeLeadId] = Object.assign({}, leads[activeLeadId], patch);
  }
  function saveCustomField(key, value){
    if(!activeLeadId) return;
    var l = leads[activeLeadId];
    var custom = Object.assign({}, l.custom || {});
    custom[key] = value;
    db.doc('leads/' + activeLeadId).update({custom: custom, updatedAt: nowIso()});
    leads[activeLeadId] = Object.assign({}, l, {custom: custom});
  }

  function addCustomField(){
    openFormModal({
      title:'Neues Feld',
      fields:[{key:'label', label:'Feldname', placeholder:'z. B. Bevorzugter Termin'}],
      submitLabel:'Hinzufügen',
      onSubmit: function(vals){
        if(!vals.label || !vals.label.trim()) return;
        var pipeline = pipelines[currentPipelineId];
        var key = vals.label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'') || uid().slice(0,6);
        var fields = (pipeline.fields || []).concat([{key:key, label: vals.label.trim()}]);
        db.doc('pipelines/' + currentPipelineId).update({fields: fields}).then(function(){
          toast('Feld hinzugefügt');
        });
      }
    });
  }

  function toggleStatusMenu(cols, currentCol){
    var wrap = document.getElementById('statusWrap');
    var existing = document.getElementById('statusMenu');
    if(existing){ existing.remove(); return; }
    var menu = el('div', 'status-menu'); menu.id = 'statusMenu';
    cols.forEach(function(c){
      var btn = el('button', c.id === currentCol.id ? 'current' : '', colDot(c.color) + '<span>' + esc(c.name) + '</span>');
      btn.addEventListener('click', function(){
        moveLeadToStatus(activeLeadId, c.id);
        menu.remove();
      });
      menu.appendChild(btn);
    });
    wrap.appendChild(menu);
    setTimeout(function(){
      document.addEventListener('click', function onDoc(e){
        if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', onDoc); }
      });
    }, 0);
  }

  function toggleKebabMenu(){
    var wrap = document.getElementById('kebabWrap');
    var existing = document.getElementById('kebabMenu');
    if(existing){ existing.remove(); return; }
    var menu = el('div', 'kebab-menu'); menu.id = 'kebabMenu';
    menu.innerHTML =
      '<button id="mExport"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 9V4h12v5M6 18h12v-5H6v5z"/><rect x="6" y="13" width="12" height="7"/></svg>PDF exportieren</button>' +
      '<button id="mMove"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>Verschieben</button>' +
      '<button id="mDownload"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>Herunterladen</button>' +
      '<hr/>' +
      '<button id="mDelete" class="danger"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/></svg>Löschen</button>';
    wrap.appendChild(menu);
    document.getElementById('mExport').addEventListener('click', exportLeadPdf);
    document.getElementById('mMove').addEventListener('click', openMoveModal);
    document.getElementById('mDownload').addEventListener('click', downloadLead);
    document.getElementById('mDelete').addEventListener('click', deleteLead);
    setTimeout(function(){
      document.addEventListener('click', function onDoc(e){
        if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', onDoc); }
      });
    }, 0);
  }

  function openMoveModal(){
    var others = pipelineOrder.filter(function(id){ return id !== leads[activeLeadId].pipelineId; });
    if(others.length === 0){ toast('Keine weitere Kampagne vorhanden'); return; }
    openFormModal({
      title:'Lead verschieben',
      sub:'Der Lead behält Status, Notizen und Verlauf.',
      fields:[{key:'target', label:'Ziel-Kampagne', type:'select', options: others.map(function(id){ return {value:id, label: pipelines[id].name}; })}],
      submitLabel:'Verschieben',
      onSubmit: function(vals){
        db.doc('leads/' + activeLeadId).update({pipelineId: vals.target, updatedAt: nowIso()}).then(function(){
          logHistory(activeLeadId, vals.target, {type:'note', text:'Lead nach „' + pipelines[vals.target].name + '“ verschoben'});
          toast('Lead verschoben');
          closeLead();
        });
      }
    });
  }

  function downloadLead(){
    var l = leads[activeLeadId];
    var pipeline = pipelines[l.pipelineId];
    var col = columnOf(l.statusId);
    var lines = [
      'Lead: ' + (l.name||''), 'Kampagne: ' + pipeline.name, 'Status: ' + (col?col.name:l.statusId),
      'E-Mail: ' + (l.email||''), 'Telefon: ' + (l.phone||''), ''
    ];
    (pipeline.fields||[]).forEach(function(f){ lines.push(f.label + ': ' + ((l.custom||{})[f.key]||'')); });
    lines.push('', 'Beschreibung:', l.description || '—', '', 'Verlauf:');
    historyEntries.forEach(function(h){
      if(h.type === 'note') lines.push('[' + fmtRelative(h.ts) + ' · ' + authorLabel(h) + '] Notiz: ' + h.text);
      else lines.push('[' + fmtRelative(h.ts) + ' · ' + authorLabel(h) + '] Status: ' + (h.fromStatus||'-') + ' » ' + h.toStatus);
    });
    var blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (l.name||'lead').replace(/[^a-z0-9äöüß _-]/gi,'') + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast('Heruntergeladen');
  }

  function exportLeadPdf(){
    var l = leads[activeLeadId];
    var pipeline = pipelines[l.pipelineId];
    var col = columnOf(l.statusId);
    var win = window.open('', '_blank', 'width=720,height=900');
    if(!win){ toast('Popup wurde blockiert – bitte erlauben'); return; }
    var rows = [
      ['Kampagne', pipeline.name], ['Status', col ? col.name : l.statusId],
      ['E-Mail', l.email||'—'], ['Telefon', l.phone||'—']
    ];
    (pipeline.fields||[]).forEach(function(f){ rows.push([f.label, (l.custom||{})[f.key] || '—']); });
    var histHtml = historyEntries.slice().reverse().map(function(h){
      var line = h.type === 'note' ? esc(h.text) :
        'Status geändert: ' + esc((columnOf(h.fromStatus)||{name:h.fromStatus||'—'}).name) + ' → ' + esc((columnOf(h.toStatus)||{name:h.toStatus}).name);
      return '<div style="padding:8px 0;border-bottom:1px solid #ddd;"><div style="font-size:11px;color:#888;">' + esc(fmtRelative(h.ts)) + ' · ' + esc(authorLabel(h)) + '</div><div>' + line + '</div></div>';
    }).join('');
    win.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(l.name||'Lead') + '</title>' +
      '<style>body{font-family:-apple-system,Arial,sans-serif;color:#222;padding:32px;max-width:680px;margin:auto;}' +
      'h1{font-size:22px;margin:0 0 4px;}p.sub{color:#777;margin:0 0 20px;}' +
      'table{width:100%;border-collapse:collapse;margin-bottom:20px;}td{padding:6px 0;border-bottom:1px solid #eee;font-size:13px;}' +
      'td:first-child{color:#888;width:160px;}h2{font-size:14px;margin:22px 0 6px;}</style></head><body>' +
      '<h1>' + esc(l.name||'Lead') + '</h1><p class="sub">Exportiert am ' + esc(new Date().toLocaleString('de-DE')) + '</p>' +
      '<table>' + rows.map(function(r){ return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</table>' +
      '<h2>Beschreibung</h2><div style="font-size:13px;white-space:pre-wrap;">' + esc(l.description||'—') + '</div>' +
      '<h2>Verlauf</h2>' + (histHtml || '<div style="color:#888;font-size:13px;">Kein Verlauf</div>') +
      '<script>window.onload=function(){setTimeout(function(){window.print();},200);}<\/script>' +
      '</body></html>'
    );
    win.document.close();
  }

  function deleteLead(){
    var l = leads[activeLeadId];
    openFormModal({
      title:'Lead löschen?',
      sub:'„' + (l.name||'Dieser Lead') + '“ und sein Verlauf werden dauerhaft entfernt. Das kann nicht rückgängig gemacht werden.',
      fields: [],
      submitLabel:'Endgültig löschen',
      danger: true,
      onSubmit: function(){
        var id = activeLeadId;
        closeLead();
        db.doc('leads/' + id).delete();
        db.collection('history').where('leadId','==',id).get().then(function(snap){
          snap.docs.forEach(function(d){ db.doc('history/' + d.id).delete(); });
        });
        toast('Lead gelöscht');
      }
    });
  }

  /* ============================================================
     Notes & timeline
     ============================================================ */
  function submitNote(inputEl){
    var text = inputEl.value.trim();
    if(!text) return;
    logHistory(activeLeadId, leads[activeLeadId].pipelineId, {type:'note', text: text});
    inputEl.value = '';
  }

  function renderTimeline(){
    var tl = document.getElementById('timeline');
    if(!tl) return;
    var entries = activeTab === 'notizen' ? historyEntries.filter(function(h){ return h.type === 'note'; }) : historyEntries;
    if(entries.length === 0){
      tl.innerHTML = '<div style="color:var(--text-faint);font-size:12.5px;padding:8px 0;">' +
        (activeTab === 'notizen' ? 'Noch keine Notizen.' : 'Noch kein Verlauf.') + '</div>';
      return;
    }
    // group by day, ascending within a day; most recent day first
    var groups = [];
    var lastKey = null;
    entries.forEach(function(h){
      var key = new Date(h.ts).toDateString();
      if(key !== lastKey){ groups.push({key:key, label: dayLabel(h.ts), items: []}); lastKey = key; }
      groups[groups.length-1].items.push(h);
    });
    groups.reverse();
    tl.innerHTML = '';
    groups.forEach(function(g){
      var block = el('div');
      block.appendChild(el('div', 'tl-day', esc(g.label)));
      var entries = el('div', 'tl-entries');
      g.items.slice().reverse().forEach(function(h){
        var entry = el('div', 'tl-entry');
        if(h.type === 'note'){
          entry.innerHTML = '<div class="tl-meta"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>' +
            '<span>Notiz</span><span>·</span><span class="mono">' + esc(fmtRelative(h.ts)) + '</span>' +
            (h.editedAt ? '<span>·</span><span class="tl-edited">bearbeitet</span>' : '') +
            '<span>·</span><span class="tl-author">' + esc(authorLabel(h)) + '</span>' +
            (isAdmin ? '<span class="tl-spacer"></span><div class="tl-actions">' +
              '<button class="tl-action-btn" data-act="edit" title="Notiz bearbeiten"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>' +
              '<button class="tl-action-btn tl-action-danger" data-act="delete" title="Notiz löschen"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6h16z"/></svg></button>' +
            '</div>' : '') +
            '</div>' +
            '<div class="tl-note">' + esc(h.text) + '</div>';
          if(isAdmin){
            var editBtn = entry.querySelector('[data-act="edit"]');
            var delBtn = entry.querySelector('[data-act="delete"]');
            if(editBtn) editBtn.addEventListener('click', function(){ editNoteEntry(h); });
            if(delBtn) delBtn.addEventListener('click', function(){ deleteNoteEntry(h); });
          }
        } else {
          var fromCol = columnOf(h.fromStatus), toCol = columnOf(h.toStatus);
          entry.innerHTML = '<div class="tl-meta"><svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>' +
            '<span>Statusänderung</span><span>·</span><span class="mono">' + esc(fmtRelative(h.ts)) + '</span><span>·</span><span class="tl-author">' + esc(authorLabel(h)) + '</span></div>' +
            '<div class="tl-status">' +
              (fromCol ? ('<span class="status-pill">' + colDot(fromCol.color) + esc(fromCol.name) + '</span>') : '<span class="status-pill">—</span>') +
              '<span class="tl-arrow">»</span>' +
              (toCol ? ('<span class="status-pill">' + colDot(toCol.color) + esc(toCol.name) + '</span>') : '<span class="status-pill">' + esc(h.toStatus) + '</span>') +
            '</div>';
        }
        entries.appendChild(entry);
      });
      block.appendChild(entries);
      tl.appendChild(block);
    });
  }

  /* ============================================================
     Files tab (assets capability)
     ============================================================ */
  function renderFilesTab(){
    var wrap = el('div', 'files-grid');
    if(!assets){
      wrap.appendChild(el('div', '', '<span style="color:var(--text-faint);font-size:12.5px;">Datei-Uploads sind in dieser Ansicht nicht verfügbar.</span>'));
      return wrap;
    }
    var uploadRow = el('div');
    var uploadBtn = el('button', 'btn btn-sm', '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg> Datei hochladen');
    var fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.style.display = 'none';
    uploadBtn.addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(){
      if(!fileInput.files[0]) return;
      var file = fileInput.files[0];
      assets.upload(file).then(function(res){
        var l = leads[activeLeadId];
        var files = (l.files || []).concat([{id: res.id, name: file.name, size: res.sizeBytes, url: res.url}]);
        db.doc('leads/' + activeLeadId).update({files: files, updatedAt: nowIso()}).then(function(){
          leads[activeLeadId] = Object.assign({}, l, {files: files});
          renderLeadDetail();
          toast('Datei hochgeladen');
        });
      }).catch(function(){ toast('Upload fehlgeschlagen'); });
    });
    uploadRow.appendChild(uploadBtn);
    uploadRow.appendChild(fileInput);
    wrap.appendChild(uploadRow);

    var l = leads[activeLeadId];
    (l.files || []).forEach(function(f){
      var row = el('div', 'file-row');
      row.innerHTML = '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M14 3v5h5M6 3h8l5 5v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>' +
        '<a class="fname" href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>' +
        '<span class="fsize">' + Math.round((f.size||0)/1024) + ' KB</span>';
      var delBtn = el('button', 'iconbtn', '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>');
      delBtn.style.width='26px'; delBtn.style.height='26px';
      delBtn.addEventListener('click', function(){
        assets.delete(f.id).catch(function(){});
        var files = (l.files||[]).filter(function(x){ return x.id !== f.id; });
        db.doc('leads/' + activeLeadId).update({files: files, updatedAt: nowIso()}).then(function(){
          leads[activeLeadId] = Object.assign({}, l, {files: files});
          renderLeadDetail();
        });
      });
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });
    if((l.files||[]).length === 0){
      wrap.appendChild(el('div', '', '<span style="color:var(--text-faint);font-size:12.5px;">Noch keine Dateien.</span>'));
    }
    return wrap;
  }

  /* ============================================================
     Generic form modal (create pipeline / lead / field / move / confirm)
     ============================================================ */
  function openFormModal(cfg){
    // nested:true renders into a second, independent overlay layer (modalRoot2) instead of
    // clearing modalRoot — used when a form needs to open on top of an already-open modal
    // (e.g. "Notiz bearbeiten" over the offenen Lead-Detail-Popup) without destroying it.
    var root = document.getElementById(cfg.nested ? 'modalRoot2' : 'modalRoot');
    var overlay = el('div', 'overlay');
    var modal = el('div', 'modal modal-md form-modal');
    var html = '<h2 class="form-title">' + esc(cfg.title) + '</h2>';
    if(cfg.sub) html += '<p class="form-sub">' + esc(cfg.sub) + '</p>';
    html += '<div id="formFields"></div><div class="form-actions">' +
      '<button class="btn btn-ghost" id="formCancel">Abbrechen</button>' +
      '<button class="btn ' + (cfg.danger ? 'btn-primary' : 'btn-primary') + '" id="formSubmit" style="' + (cfg.danger ? 'background:var(--danger);border-color:var(--danger);' : '') + '">' + esc(cfg.submitLabel || 'Speichern') + '</button>' +
      '</div>';
    modal.innerHTML = html;
    var fieldsWrap = modal.querySelector('#formFields');
    (cfg.fields || []).forEach(function(f){
      var row = el('div', 'form-row');
      var label = el('label', '', esc(f.label));
      label.htmlFor = 'f_' + f.key;
      row.appendChild(label);
      var input;
      if(f.type === 'select'){
        input = document.createElement('select');
        (f.options||[]).forEach(function(o){
          var opt = document.createElement('option');
          opt.value = o.value; opt.textContent = o.label;
          if(o.value === f.value) opt.selected = true;
          input.appendChild(opt);
        });
      } else if(f.type === 'textarea'){
        input = document.createElement('textarea');
        input.rows = 4;
        input.placeholder = f.placeholder || '';
        input.value = f.value || '';
      } else {
        input = document.createElement('input');
        input.type = f.type || 'text';
        input.placeholder = f.placeholder || '';
        input.value = f.value || '';
      }
      input.id = 'f_' + f.key;
      input.dataset.key = f.key;
      row.appendChild(input);
      fieldsWrap.appendChild(row);
    });
    overlay.appendChild(modal);
    root.innerHTML = '';
    root.appendChild(overlay);
    overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) root.innerHTML=''; });
    modal.querySelector('#formCancel').addEventListener('click', function(){ root.innerHTML=''; });
    var firstInput = modal.querySelector('input,select,textarea');
    if(firstInput) setTimeout(function(){ firstInput.focus(); }, 30);
    modal.querySelector('#formSubmit').addEventListener('click', function(){
      var vals = {};
      (cfg.fields||[]).forEach(function(f){ vals[f.key] = modal.querySelector('#f_'+f.key).value; });
      cfg.onSubmit(vals);
      root.innerHTML = '';
    });
  }

  /* ============================================================
     Global key handling
     ============================================================ */
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      // Ein offener nested Dialog (z. B. "Notiz bearbeiten") wird zuerst geschlossen,
      // ohne das dahinterliegende Lead-Popup mit zu schließen.
      var mr2 = document.getElementById('modalRoot2');
      if(mr2 && mr2.innerHTML.trim() !== ''){ mr2.innerHTML = ''; return; }
      if(activeLeadId) closeLead();
    }
  });

  /* ============================================================
     Go
     ============================================================ */
  initAuth();
})();
</script>
</body>
</html>
